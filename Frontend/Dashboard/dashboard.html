<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/Dashboard/dashboard.css">
    </head>
    <body>
        <div class="dashboard">
            <aside class="sidebar">
                <nav>
                    <button class="nav-btn active" data-page="overview">
                        🏠 Overview
                    </button>

                    <button class="nav-btn" data-page="send">
                        💸 Send Money
                    </button>

                    <button class="nav-btn" data-page="transactions">
                        📜 Transactions History
                    </button>

                    <button class="nav-btn" data-page="settings">
                        ⚙️ Settings
                    </button>
                </nav>
            </aside>

            <main class="main-content">

                <header class="topbar">
                    <h2 id="page-title">🏠 Dashboard</h2>
                    <div class="profile">
                        Leo
                    </div>
                </header>

                <section class="page active" id="overview">
                    <h1>Welcome, Leo!</h1>
                    <p>Here's your banking overview.</p>

                    <div class="cards">
                        <div class="card">
                            <h3>Total Balance</h3>
                            <h2>₹50,000</h2>
                        </div>
                    </div>

                    <h2>Quick Actions</h2>
                    <div class="quick-actions">
                        <button>Send Money</button>
                        <button>Account Statement</button>
                    </div>
                </section>

                <section class="page" id="send">
                    <h1>Send Money</h1>
                    <p>Make payments quickly and securely.</p>
                </section>

                <section class="page" id="transactions">
                    <h1>Transactions history</h1>
                </section>

                <section class="page" id="settings">
                    <h1>Settings</h1>

                    <div class="cards">
                        <div class="card">Logout</div>
                        <div class="card">Change Password</div>
                    </div>
                </section>

            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
