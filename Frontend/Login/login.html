<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="login.css" >
    </head>
    <body>
        <div id="login_form">
            <form>
                <input type="text" name="email" placeholder="Email" id="login_email"></input>
                <input type="password" name="password" placeholder="Password" id="login_password"></input>
                <button id="login" onclick="login">Login</button>
            </form>
        </div>
        <div class="footer">
            <p>Don't have an account? <a href="../registration/registration.html">Register</a></p>
        </div>
        <script src="../main.js"></script>
    </body>
</html>
