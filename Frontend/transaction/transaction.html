<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Money - Internet Banking</title>
  <link rel="stylesheet" href="transaction.css" />
</head>
<body>
  <div class="transaction-container">
    <div class="transaction-card">
      <div class="transaction-header">
        <h2>Send Money</h2>
        <p>Transfer funds securely via email</p>
      </div>

      <form class="transaction-form" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="email">Recipient email</label>
          <input type="email" id="email" name="email" placeholder="email@example.com" required autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="amount">Amount (Rs.)</label>
          <input type="number" id="amount" name="amount" placeholder="0" step="1" min="1" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="transaction-btn" onclick="make_payment()">
          Send
        </button>
      </form>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
