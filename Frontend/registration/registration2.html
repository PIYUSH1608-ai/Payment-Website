<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Registration - Internet Banking</title>
  <link rel="stylesheet" href="./registration.css" />
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <h2>Account Details</h2>
        <p>Step 2 of 2: Finalize your banking profile</p>
      </div>

      <form class="register-form">
        <div class="form-group">
          <label for="debitcard">Debit Card Number</label>
          <input type="text" id="debitcard" name="debitcard" placeholder="debitcard Number" maxlength="19" required autocomplete="cc-number" />
        </div>

        <div class="form-group">
          <label for="accountnumber">Account Number</label>
          <input type="text" id="accountnumber" name="accountnumber" placeholder="Account Number" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="new-password" />
        </div>

        <button type="button" class="register-btn" onclick="submit_details()">
          Complete Registration
        </button>
        <script src="/main.js"></script>
      </form>
    </div>
  </div>
</body>
</html>
